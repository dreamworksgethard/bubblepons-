<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bubble Pons live bubble map — explore crypto tokens as floating bubbles.">
  <title>Bubble Map Bubble Pons</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body class="page-map">
  <div class="sky-environment" aria-hidden="true">
    <div class="sky-gradient"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
    <div class="atmosphere"></div>
    <div class="bg-bubbles" id="bgBubbles"></div>
    <div class="particles" id="particles"></div>
  </div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="siteHeader">
    <nav class="nav-bar" aria-label="Primary">
      <a class="nav-brand" href="index.html">
        <img src="logo.png" alt="" class="nav-logo" width="40" height="40">
        <span class="nav-brand-text">BUBBLE PONS</span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <div class="nav-menu" id="navMenu">
        <ul class="nav-links">
          <li><a href="index.html#home">HOME</a></li>
          <li><a href="index.html#about">ABOUT</a></li>
          <li><a href="index.html#how-it-works">HOW IT WORKS</a></li>
        </ul>
        <div class="nav-actions">
          <a class="btn btn-nav btn-x" href="https://x.com/BubblePons" target="_blank" rel="noopener noreferrer" aria-label="Follow Bubble Pons on X">
            <img class="x-icon" src="x-logo.png" alt="X" width="18" height="18">
          </a>
          <a class="btn btn-nav" href="map.html" aria-current="page">BUBBLE MAP</a>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="map-page-main">
    <section class="bubble-map-section map-page-section" id="bubble-map" aria-labelledby="map-title">
      <div class="map-page-top">
        <div>
          <p class="demo-badge">DEMO MARKET DATA</p>
          <h1 id="map-title" class="map-page-title">BUBBLE MAP</h1>
        </div>
      </div>

      <div class="map-controls glass-panel" role="toolbar" aria-label="Bubble map controls">
        <div class="control-group">
          <span class="control-label" id="timeframe-label">TIMEFRAME</span>
          <div class="control-pills" role="group" aria-labelledby="timeframe-label">
            <button type="button" class="pill" data-timeframe="1h">1H</button>
            <button type="button" class="pill" data-timeframe="6h">6H</button>
            <button type="button" class="pill active" data-timeframe="24h" aria-pressed="true">24H</button>
            <button type="button" class="pill" data-timeframe="7d">7D</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label" id="filter-label">FILTER</span>
          <div class="control-pills" role="group" aria-labelledby="filter-label">
            <button type="button" class="pill active" data-filter="all" aria-pressed="true">ALL</button>
            <button type="button" class="pill" data-filter="gainers">GAINERS</button>
            <button type="button" class="pill" data-filter="losers">LOSERS</button>
            <button type="button" class="pill" data-filter="trending">TRENDING</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label" id="size-label">SIZE BY</span>
          <div class="control-pills" role="group" aria-labelledby="size-label">
            <button type="button" class="pill active" data-sizeby="marketCap" aria-pressed="true">MARKET CAP</button>
            <button type="button" class="pill" data-sizeby="volume">VOLUME</button>
          </div>
        </div>
      </div>

      <div class="bubble-map-frame glass-panel map-page-frame">
        <div class="bubble-map" id="bubbleMap" role="list" aria-label="Interactive token bubble map"></div>
        <p class="map-empty" id="mapEmpty" hidden>No bubbles match this filter.</p>
      </div>
    </section>
  </main>

  <aside class="token-panel" id="tokenPanel" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="panelTokenName">
    <div class="token-panel-backdrop" id="panelBackdrop"></div>
    <div class="token-panel-sheet glass-panel">
      <button type="button" class="panel-close" id="panelClose" aria-label="Close token details">&times;</button>
      <div class="panel-bubble-preview">
        <img src="bubble.png" alt="" class="panel-bubble-img" id="panelBubbleImg">
        <div class="panel-bubble-glow" id="panelBubbleGlow"></div>
      </div>
      <h2 id="panelTokenName">PONS</h2>
      <p class="panel-ticker" id="panelTicker">$PONS</p>
      <p class="panel-change" id="panelChange">+42.8%</p>
      <dl class="panel-stats">
        <div>
          <dt>MARKET CAP</dt>
          <dd id="panelMcap">$12.4M</dd>
        </div>
        <div>
          <dt>VOLUME</dt>
          <dd id="panelVolume">$3.1M</dd>
        </div>
        <div>
          <dt>STATUS</dt>
          <dd id="panelStatus">TRENDING</dd>
        </div>
      </dl>
      <a class="btn btn-primary panel-cta" href="#" id="panelCta">VIEW TOKEN</a>
      <p class="panel-disclaimer">Demo data for illustration only.</p>
    </div>
  </aside>

  <script src="script.js?v=11"></script>
</body>
</html>
